<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your shopping cart at Whiff and Wonder">
    <title>Cart | Whiff & Wonder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">
</head>

<body>

    <!-- Header — matches all other pages -->
    <header id="header-placeholder"></header>

    <!-- Main Content -->
    <main class="container">

        <!-- Cart Header -->
        <section class="cart-header">
            <h1>Your Cart</h1>
        </section>

        <!-- Empty Cart Message -->
        <section class="empty-cart" id="emptyCart">
            <p>Your cart is empty</p>
            <a href="products.html" class="btn btn-primary">Continue Shopping</a>
        </section>

        <!-- Cart Container -->
        <section class="cart-container hidden" id="cartContainer">

            <!-- Cart Items Table -->
            <section class="cart-items">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th scope="col">Item</th>
                            <th scope="col">Name</th>
                            <th scope="col">Quantity</th>
                            <th scope="col">Price</th>
                            <th scope="col"><span class="visually-hidden">Remove</span></th>
                        </tr>
                    </thead>
                    <tbody id="cartItems">
                        <!-- Dynamically inserted by JavaScript -->
                    </tbody>
                </table>
            </section>

            <!-- Order Summary -->
            <aside class="cart-summary">
                <h3>Order Summary</h3>

                <dl class="summary-list">
                    <dt>Subtotal</dt>
                    <dd id="subtotal">$0.00</dd>

                    <dt>Shipping</dt>
                    <dd id="shipping">$0.00</dd>

                    <dt class="total">Total</dt>
                    <dd id="total" class="total">$0.00</dd>
                </dl>

                <button class="btn btn-primary" onclick="proceedToCheckout()">
                    Proceed to Checkout
                </button>
            </aside>

        </section>
    </main>

    <!-- Footer -->
    <footer id="footer-placeholder"></footer>

    <script src="js/main.js"></script>
    <script src="js/includes.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
