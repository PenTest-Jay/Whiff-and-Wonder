<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch with Whiff and Wonder">
    <title>Contact Us | Whiff & Wonder</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/contact.css">
</head>

<body>

    <!-- Header — matches all other pages -->
    <header id="header-placeholder"></header>

    <main>
        <section class="contact">
            <div class="container">

                <!-- Contact Header -->
                <hgroup class="contact-header">
                    <h1>Get in Touch</h1>
                    <p>We'd love to hear from you</p>
                </hgroup>

                <!-- Success Banner -->
                <p id="successBanner" class="success-banner" hidden>
                    ✓ Thank you! We'll be in touch soon.
                </p>

                <!-- Contact Form -->
                <form id="contactForm" class="contact-form" novalidate>

                    <fieldset class="form-group">
                        <label for="fullName">Full Name <abbr title="required">*</abbr></label>
                        <input type="text" id="fullName" name="fullName" required placeholder="Jane Doe"
                            aria-describedby="nameError">
                        <small id="nameError" class="error-message" hidden>
                            Please enter your full name (letters only)
                        </small>
                    </fieldset>

                    <fieldset class="form-group">
                        <label for="email">Email Address <abbr title="required">*</abbr></label>
                        <input type="email" id="email" name="email" required placeholder="you@example.com"
                            aria-describedby="emailError">
                        <small id="emailError" class="error-message" hidden>
                            Please enter a valid email address
                        </small>
                    </fieldset>

                    <fieldset class="form-group">
                        <label for="subject">Subject</label>
                        <select id="subject" name="subject">
                            <option value="" disabled selected>Select a topic...</option>
                            <option value="order">Order Enquiry</option>
                            <option value="product">Product Question</option>
                            <option value="wholesale">Wholesale</option>
                            <option value="other">Other</option>
                        </select>
                    </fieldset>

                    <fieldset class="form-group">
                        <label for="message">Message <abbr title="required">*</abbr></label>
                        <textarea id="message" name="message" required placeholder="Tell us how we can help..."
                            aria-describedby="messageError"></textarea>
                        <small id="messageError" class="error-message" hidden>
                            Please enter your message
                        </small>
                    </fieldset>

                    <button type="submit" class="btn btn-primary w-100">
                        Send Message →
                    </button>

                </form>

            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer id="footer-placeholder"></footer>

    <script src="js/includes.js"></script>
    <script src="js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
